[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facode-roundtable"
version = "0.8.1"
description = "A login-only council of frontier model CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Frontier Infra" }, { name = "Facode" }]
keywords = ["llm", "ai", "council", "deliberation", "cli", "mcp", "claude", "grok", "gemini", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = ["mcp>=2,<3"]

[dependency-groups]
dev = ["jsonschema>=4.26,<5", "pytest>=9,<10"]

[project.scripts]
roundtable = "facode_roundtable.cli:main"

[project.urls]
Homepage = "https://github.com/focofacofoco/roundtable"
Repository = "https://github.com/focofacofoco/roundtable"
Issues = "https://github.com/focofacofoco/roundtable/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/facode_roundtable"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/roundtable/skills/roundtable/SKILL.md" = "facode_roundtable/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/docs",
  "/scripts",
  "/src",
  "/tests",
  "/plugins",
  "/README.md",
  "/AGENTS.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
