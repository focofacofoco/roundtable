name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv build

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reproducible artifacts
        run: uv run --frozen python scripts/check_reproducible_build.py
      - name: Build wheel for isolated smoke test
        run: uv build --out-dir .artifacts/dist
      - name: Smoke-test installed wheel
        run: uv run --frozen python scripts/check_wheel.py .artifacts/dist
      - name: Orchestration soak
        run: uv run --frozen python scripts/soak.py --iterations 200 --output .artifacts/soak.json
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .artifacts/audit-requirements.txt
      - name: Audit locked runtime dependencies
        run: uvx pip-audit -r .artifacts/audit-requirements.txt
