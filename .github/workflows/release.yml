name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/validate_release.py

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv build

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/check_reproducible_build.py
      - run: uv build --out-dir .artifacts/release
        env:
          SOURCE_DATE_EPOCH: "315532800"
      - run: python scripts/write_checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: .artifacts/release/
          if-no-files-found: error

  release-gates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .artifacts/release
      - run: uv run --frozen python scripts/check_wheel.py .artifacts/release
      - run: uv run --frozen python scripts/soak.py --iterations 200 --output .artifacts/soak.json
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .artifacts/audit-requirements.txt
      - run: uvx pip-audit -r .artifacts/audit-requirements.txt

  publish:
    needs: [test, release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .artifacts/release
      - run: gh release create "$GITHUB_REF_NAME" .artifacts/release/*.whl .artifacts/release/*.tar.gz .artifacts/release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/verify_release_state.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
